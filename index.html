    <main class="main">
      <section class="gallery">
        <picture>
           <source
          srcset="
            ./assets/images/desktop/image-grid-1.jpg    1x,
            ./assets/images/desktop/image-grid-1@2x.jpg 2x
          "
          media="(min-width: 90rem)"
          width="635"
          height="400"
          />
          <source
          srcset="
            ./assets/images/tablet/image-grid-1.jpg    1x,
            ./assets/images/tablet/image-grid-1@2x.jpg 2x
          "
          media="(min-width: 48rem)"
          width="398"
          height="400"
          />
          <img src="./assets/images/mobile/image-grid-1.jpg"
          srcset="./assets/images/mobile/image-grid-1.jpg 1x,
          ./assets/images/mobile/image-grid-1@2x.jpg 2x" 
          width="343"
          height="320"
          alt="">
        </picture>
        <article class="gallery__article">
          <h2 class="gallery__article-title">Your day at the gallery</h2>
          <p class="gallery__article-text">
            Wander through our distinct collections and find new insights about
            our artists. Dive into the details of their creative process.
          </p>
        </article>
      </section>
      <section class="inspiration">
        <picture>
           <source
          srcset="
            ./assets/images/desktop/image-grid-2.jpg    1x,
            ./assets/images/desktop/image-grid-2@2x.jpg 2x

          media="(min-width: 90rem)"
          width="635"
          height="720"
          /> 
          <source
          srcset="
            ./assets/images/tablet/image-grid-2.jpg    1x,
            ./assets/images/tablet/image-grid-2@2x.jpg 2x
          "
          media="(min-width: 48rem)"
          width="398"
          height="720"
          /> 
          <img src="./assets/images/mobile/image-grid-2.jpg"
          srcset="./assets/images/mobile/image-grid-2.jpg 1x,
          ./assets/images/mobile/image-grid-2@2x.jpg 2x" 
          width="343"
          height="480"
          alt="">
        </picture>
         <picture>

            ./assets/images/desktop/image-grid-3.jpg    1x,
            ./assets/images/desktop/image-grid-3@2x.jpg 2x

          <img src="./assets/images/mobile/image-grid-3.jpg"

          ./assets/images/mobile/image-grid-3@2x.jpg 2x" 
          width="343"
          height="200"
          alt="">

        <article class="inspiration__aricle">
          <h2 class="inspiration__article-title">Come &amp; be inspired</h2>
          <p class="inspiration__article-text">
            We’re excited to welcome you to our gallery and see how our
            collections influence you.
          </p>
        </article>
      </section>
